<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Calcify International">
  <title>Calcify International</title>
  <!--
    The Lattice mark: a single hexagonal lattice cell — six outer nodes bound
    to one core node. Mirrors the site's signature WebGL element.
    Drawn procedurally; no raster source.
  -->
  <g stroke="#5B6EF5" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hexagon perimeter -->
    <path d="M16 3.5 27 9.75 27 22.25 16 28.5 5 22.25 5 9.75Z" />
    <!-- Spokes to the core -->
    <path d="M16 3.5 16 16M27 9.75 16 16M27 22.25 16 16M16 28.5 16 16M5 22.25 16 16M5 9.75 16 16" opacity="0.45" />
  </g>
  <!-- Outer nodes -->
  <g fill="#5B6EF5">
    <circle cx="16" cy="3.5" r="1.9" />
    <circle cx="27" cy="9.75" r="1.9" />
    <circle cx="27" cy="22.25" r="1.9" />
    <circle cx="16" cy="28.5" r="1.9" />
    <circle cx="5" cy="22.25" r="1.9" />
    <circle cx="5" cy="9.75" r="1.9" />
  </g>
  <!-- Core node, accent-pulse -->
  <circle cx="16" cy="16" r="3.1" fill="#3FE0D0" />
</svg>
